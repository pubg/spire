name: Datadog Test Image Publish
on:
  push:
    branches:
      - codex/spire-datadog-publish

permissions:
  contents: read
  packages: write

env:
  DATADOG_INSTRUMENTATION: "true"
  PLATFORMS: linux/amd64

jobs:
  publish-spire-server:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install regctl
        uses: regclient/actions/regctl-installer@4b4db1dcc7dad75ad67a788a380f75a20cc8a040 # main

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build spire-server image
        run: make spire-server-image TAG="1.14.5-datadog.${GITHUB_SHA::12}"

      - name: Push spire-server image
        run: |
          image_tag="datadog-${GITHUB_SHA::12}"
          oci_dir="ocidir://${GITHUB_WORKSPACE}/oci/spire-server"
          regctl image import "${oci_dir}" spire-server-image.tar
          regctl image copy "${oci_dir}" "ghcr.io/pubg/spire-server:${image_tag}"
